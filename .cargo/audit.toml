# Advisories with no reachable fix. Anything not listed here fails the build, warnings included.
[advisories]
ignore = [
  # rsa 0.9.10: Marvin timing attack; openidconnect 4.1.0 requires rsa ^0.9.2.
  # Remove when openidconnect accepts the fixed rsa >=0.10.0.
  "RUSTSEC-2023-0071",
]

[output]
deny = ["warnings"]
quiet = false
