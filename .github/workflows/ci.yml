name: CI and release

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Check image release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - name: Build container
        run: docker build --tag persona-idp:ci .

  publish_image:
    if: github.event_name == 'push'
    needs: [verify]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: docker.io/${{ vars.DOCKERHUB_IMAGE || 'cubesystems/persona-idp' }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
