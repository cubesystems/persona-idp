[package]
name = "persona-idp"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = { version = "0.11", features = ["getrandom"] }
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
hex = "0.4.3"
openidconnect = "4.1.0"
percent-encoding = "2.3"
rand = "0.10.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }
url = "2.5.8"
